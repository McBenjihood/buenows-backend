version: "3.9"

services:
  db_postgres:
    image: postgres:latest
    container_name: postgres_buenows
    restart: always
    environment:
      POSTGRES_PASSWORD: "5Ak94NiJqIBfY76By2i5"
      POSTGRES_DB: "buenows-main"
      POSTGRES_USER: "postgres"
    ports:
      - "2987:5432"
    volumes:
      - postgres_data_fresh:/var/lib/postgresql

volumes:
  postgres_data_fresh: