version: "3.9"

services:
  db_postgres:
    # Local development only. Production uses AWS RDS PostgreSQL, not this service.
    image: postgres:16-alpine
    container_name: postgres_buenows
    restart: always
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: "buenows-main"
      POSTGRES_USER: ${DB_USER}
    ports:
      - "2987:5432"
    volumes:
      - postgres_data_fresh:/var/lib/postgresql

volumes:
  postgres_data_fresh:
