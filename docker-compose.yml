services:
  db_postgres:
    build:
      context: .
      dockerfile: Dockerfile.Postgres
    image: buenws-postgres:18-alpine
    container_name: postgres_buenows
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set}
      POSTGRES_USER: ${DB_USER:?DB_USER must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_fresh:/var/lib/postgresql

volumes:
  postgres_data_fresh:
