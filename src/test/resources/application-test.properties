spring.application.name=buenws-backend
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.username=admin
spring.datasource.password=123
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.session.jdbc.initialize-schema=always
spring.session.store-type=none

app.cors.allowed-origins=http://localhost:5173,http://localhost:4173
app.jwt.issuer=https://bueno-ws.ch
app.public-base-url=http://localhost:8080
app.security.require-https=false

spring.docker.compose.enabled=false
spring.cloud.aws.secretsmanager.enabled=false

spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@buenows.ch
app.mail.from=test@buenows.ch
spring.mail.password=testpassword
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.forward-headers-strategy=none
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
logging.level.org.hibernate.orm.jdbc.error=ERROR