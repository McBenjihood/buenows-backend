spring.application.name=buenws-backend

spring.config.import=optional:file:.env[.properties]

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
app.jwt.issuer=${APP_JWT_ISSUER:https://bueno-ws.ch}
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
app.frontend.contact-url=${APP_FRONTEND_CONTACT_URL:http://localhost:5173/contact}
app.security.require-https=${APP_SECURITY_REQUIRE_HTTPS:false}
app.security.cookie-secure=${APP_COOKIE_SECURE:false}
app.trusted-proxy-cidrs=${APP_TRUSTED_PROXY_CIDRS:loopback,private}
spring.cloud.aws.region.static=${AWS_REGION:eu-central-2}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/buenows-main}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}

spring.docker.compose.enabled=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=info.buenows@gmail.com
spring.mail.password=${EMAIL_PWD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:none}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
logging.level.org.hibernate.orm.jdbc.error=ERROR

# Chatbot
# OPENAI_API_KEY must be provided as a server-side environment variable.
app.chatbot.health-details=${CHATBOT_HEALTH_DETAILS:false}
app.chatbot.history-retention-days=${CHATBOT_HISTORY_RETENTION_DAYS:7}
