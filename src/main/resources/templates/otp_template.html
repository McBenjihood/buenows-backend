<!DOCTYPE html>
<html lang="{{HTML_LANG}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap');
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #171717; font-family: 'Google Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #e1e1e1; -webkit-font-smoothing: antialiased;">
<table border="0" cellpadding="0" cellspacing="0" width="100%" style="table-layout: fixed; background-color: #171717;">
    <tr>
        <td align="center" style="padding: 40px 0;">
            <table border="0" cellpadding="0" cellspacing="0" width="600" style="background-color: #312E3A; border-radius: 16px; width: 600px; max-width: 90%;">
                <tr>
                    <td align="center" style="padding: 40px 0 20px 0;">
                        <h1 style="margin: 0; font-size: 28px; font-weight: 700; color: #42b883;">{{BRAND}}</h1>
                    </td>
                </tr>

                <tr>
                    <td style="padding: 0 40px 40px 40px;">
                        <h2 style="margin: 0 0 20px 0; font-size: 24px; font-weight: 500; color: #ffffff; text-align: center;">{{HEADING}}</h2>


                        <table border="0" cellpadding="0" cellspacing="0" align="center">
                            <tr>
                                <td align="center">
                                    <div style="display: inline-block; padding: 20px 30px; background-color: #171717; border-radius: 12px; border: 1px solid #42b883;">
                                        <span style="font-size: 42px; font-weight: 700; color: #42b883; letter-spacing: 12px; font-family: monospace;">{{OTP}}</span>
                                    </div>
                                </td>
                            </tr>
                        </table>

                        <p style="margin: 30px 0 0 0; font-size: 14px; color: #a1a1a1; text-align: center;">
                            {{INFO_TEXT}}
                        </p>
                    </td>
                </tr>

                <tr>
                    <td style="padding: 30px 40px; background-color: #27242F; border-bottom-left-radius: 16px; border-bottom-right-radius: 16px; border-top: 1px solid rgba(255,255,255,0.05); text-align: center;">
                        <p style="margin: 0; font-size: 12px; color: #a1a1a1;">
                            {{COPYRIGHT}}
                        </p>
                        <p style="margin: 10px 0 0 0; font-size: 12px; color: #a1a1a1;">
                            <a href="https://bueno-ws.ch/legal" style="color: #42b883; text-decoration: none;">{{PRIVACY_LABEL}}</a> &nbsp;&bull;&nbsp; <a href="mailto:info.buenows@gmail.com" style="color: #42b883; text-decoration: none;">{{SUPPORT_LABEL}}</a>
                        </p>
                    </td>
                </tr>
            </table>

            <table border="0" cellpadding="0" cellspacing="0" width="600" style="width: 600px; max-width: 90%;">
                <tr>
                    <td align="center" style="padding: 20px 0;">
                        <p style="margin: 0; font-size: 11px; color: #555555; text-align: center;">
                            {{REASON_TEXT}}
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
